name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (Qt + ODBC build tools)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 unixodbc-dev g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build app (PyInstaller folder mode)
        run: pyinstaller --noconfirm --clean --windowed --name PharmaPurchaseAssistant run.py
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\pharma-purchase-assistant.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PharmaPurchaseAssistant-Setup
          path: installer-output/PharmaPurchaseAssistant-Setup-1.0.0.exe
