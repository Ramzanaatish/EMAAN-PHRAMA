name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries (Qt + ODBC build tools)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 unixodbc-dev g++
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build app (folder mode, logo bundled)
        run: pyinstaller --noconfirm --clean --windowed --name PharmaPurchaseAssistant --add-data "assets;assets" run.py
      - name: Build server exe (onefile, console)
        run: pyinstaller --noconfirm --clean server.spec
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          iscc installer\pharma-purchase-assistant.iss
      - name: Upload Setup exe
        uses: actions/upload-artifact@v4
        with:
          name: PharmaPurchaseAssistant-Setup
          path: installer-output/PharmaPurchaseAssistant-Setup-1.3.0.exe
      - name: Upload Server exe
        uses: actions/upload-artifact@v4
        with:
          name: PharmaServer
          path: dist/PharmaServer.exe
